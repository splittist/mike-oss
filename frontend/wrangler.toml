main = ".open-next/worker.js"
name = "mike-frontend"
compatibility_date = "2026-01-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[[routes]]
pattern = "app.mikeoss.com"
custom_domain = true
zone_id = "ebe3ad55a3572b5efabe426fb0d13568"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[env.staging]
workers_dev = true

[[env.staging.routes]]
pattern = "staging.mikeoss.com"
custom_domain = true

[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://ofbhaoqfisucvhctosbt.supabase.co"
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY = "sb_publishable_WZx_2SJW-bc2qB89os6DpQ_Q8wzlbwB"
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_API_BASE_URL = "https://api.mikeoss.com"
